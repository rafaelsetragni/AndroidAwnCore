plugins {
    id 'com.android.library'
    id 'com.vanniktech.maven.publish' version '0.34.0'
}

group 'me.carda.awesome_notifications.core'
version '0.12.0'

android {
    compileSdkVersion = 36

    if (project.android.hasProperty('namespace')) {
        namespace 'me.carda.awesome_notifications.core'
    }

    defaultConfig {
        minSdk 23
        targetSdk 36

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
        }
        profile {
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'com.google.guava:guava:33.5.0-android'
    implementation 'me.leolin:ShortcutBadger:1.1.22@aar'

    implementation 'androidx.annotation:annotation:1.9.1'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.media:media:1.7.1'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'

//    implementation "net.zetetic:android-database-sqlcipher:4.5.3"
    implementation "androidx.sqlite:sqlite:2.6.2"

    implementation "androidx.room:room-runtime:2.8.4"
    implementation 'androidx.lifecycle:lifecycle-process:2.10.0'
    annotationProcessor "androidx.room:room-compiler:2.8.4"

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}

mavenPublishing {
    // Central Portal (central.sonatype.com) is the default and only host in vanniktech 0.34.0.
    publishToMavenCentral()
    signAllPublications()

    coordinates('me.carda', 'AndroidAwnCore', '0.12.0')

    pom {
        name = 'Awesome Notifications Android Core'
        description = 'Native Android core for the Awesome Notifications Flutter plugin.'
        url = 'https://github.com/rafaelsetragni/AndroidAwnCore'
        licenses {
            license {
                name = 'The Apache License, Version 2.0'
                url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
            }
        }
        developers {
            developer {
                id = 'rafaelsetragni'
                name = 'Rafael Setragni'
                url = 'https://github.com/rafaelsetragni/'
            }
        }
        scm {
            url = 'https://github.com/rafaelsetragni/AndroidAwnCore'
            connection = 'scm:git:git://github.com/rafaelsetragni/AndroidAwnCore.git'
            developerConnection = 'scm:git:ssh://git@github.com/rafaelsetragni/AndroidAwnCore.git'
        }
    }
}